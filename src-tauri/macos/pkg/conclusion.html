<body>
  <h1>安装完成</h1>
  <p>阑珊处已装到「应用程序」。可在 Launchpad 或「应用程序」文件夹里打开（显示名为「阑珊处」）。</p>
  <p>首次打开若被系统拦截：macOS 13 及以上到「系统设置 → 隐私与安全性」点「仍要打开」；macOS 11–12 请按住 Control 点应用图标，选「打开」。使用前请在应用「设置」里登录账号。</p>
