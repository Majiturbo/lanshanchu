<!DOCTYPE html>

<head>
<meta charset="utf-8">
<style>
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 13px;
    line-height: 1.55;
    color: #1c1c1e;
    margin: 0;
    padding: 8px 4px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  p { margin: 0 0 10px; }
  ul {
    margin: 0 0 10px;
    padding-left: 1.2em;
  }
  li { margin-bottom: 4px; }
</style>

<body>
  <h1>欢迎安装阑珊处</h1>
  <p>本向导会把阑珊处安装到「应用程序」。需要 <strong>macOS 11</strong> 或更高版本（Apple 芯片与 Intel 通用包）。新装与升级使用同一个安装包。</p>
  <ul>
    <li><strong>首次安装</strong>：按下一步安装即可。</li>
    <li><strong>升级</strong>：请先退出正在运行的阑珊处，再继续；安装包会覆盖「应用程序」里的旧版本，本机历史地图与设置会保留。</li>
  </ul>
  <p>应用尚未经过苹果公证。安装完成后若无法打开：macOS 13 及以上到「系统设置 → 隐私与安全性」点「仍要打开」；更早的系统可在「应用程序」里按住 Control 点图标，选「打开」。</p>
</body>
</html>
